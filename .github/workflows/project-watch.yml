# Daily check of Tomáš's GitHub projects: Claude Code proposes site updates as one pull request
# (.claude/skills/project-watch/SKILL.md). Runs on his Claude subscription via the
# CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`). Run it by hand from the Actions tab too.
name: Project watch

on:
  schedule:
    - cron: "0 5 * * *" # 06:00 / 07:00 in Prague
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: project-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Commits of a proposal are authored by the Actions bot.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        env:
          # gh inside Claude's shell: list repos, open the PR.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token instead of the Claude GitHub App, so no app install is needed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            TEST of the pull-request path only (step 6 of .claude/skills/project-watch/SKILL.md), no repo checks.
            Run each command on its own: `date -u +%Y-%m-%dT%H:%M:%SZ`; set "lastRun" in .github/project-watch.json to that time;
            `npm ci`; `npm run lint`; `npm run build`; `git switch -c project-watch/test-run`;
            `git commit -am "Project watch test"`; `git push -u origin HEAD`;
            `gh label list --search project-watch` and create the label as the skill says if missing;
            write a one-line Czech body to pr-body.md and run
            `gh pr create --base project-watch-test --label project-watch --title "Test hlídače – zavřít" --body-file pr-body.md`.
            Report each command's outcome.
          claude_args: '--max-turns 30 --allowedTools "Bash(gh *),Bash(git *),Bash(npm ci),Bash(npm run *),Bash(date *),Read,Edit,Write"'
          show_full_output: true
